name: Refresh analytics snapshots

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-analytics-snapshots
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run sync:youtube

      - name: Refresh optional X snapshot
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: npm run fetch:x:optional

      - run: npm run validate:data
      - run: npm test
      - name: Build with the refreshed snapshot
        env:
          VITE_MARINE_SHEET_URL: /data/marine-sheet.json
        run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke

      - name: Commit refreshed snapshots
        shell: bash
        run: |
          git add public/data/marine-sheet.json public/data/marine-x-posts.json
          if git diff --cached --quiet; then
            echo "Snapshots are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): refresh analytics snapshots"
          git push origin HEAD:main

      - name: Upload smoke failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: refresh-smoke-failure
          path: test-results/
          if-no-files-found: ignore
