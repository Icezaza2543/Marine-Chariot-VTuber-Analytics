name: Refresh analytics snapshots

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-analytics-snapshots
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run sync:youtube

      - name: Refresh optional X snapshot
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: npm run fetch:x:optional

      - name: Commit refreshed snapshots
        shell: bash
        run: |
          git add public/data/marine-ch-data.csv public/data/marine-x-posts.json
          if git diff --cached --quiet; then
            echo "Snapshots are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): refresh analytics snapshots"
          git push
