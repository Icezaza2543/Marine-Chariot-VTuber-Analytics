version: 2
updates:
  - package-ecosystem: npm
    directory: /
    # Keep the repository on a single branch; updates are reviewed manually.
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
    groups:
      npm-dependencies:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    # Keep the repository on a single branch; updates are reviewed manually.
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
